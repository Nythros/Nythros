# Release —— 打 v* tag 触发，四段流水线（ADR-019 决策 B 落地：monorepo 唯一开发源 + subsplit 发布镜像）：
#   ① release：质量门禁（phpunit/phpstan + Redis/MySQL service）→ composer 打包 zip → GitHub Release
#      （永不因发布配置缺失而失败；service 声明见 job 内注释）
#   ② subsplit：git subtree split 把 packages/engine、packages/framework、packages/skeleton 拆到
#      Nythros/engine、Nythros/framework、Nythros/skeleton 独立仓（包 composer.json 在拆分仓根目录，
#      Packagist 才可识别）——开关 repository variable `vars.SUBSPLIT_ENABLED=true` + secret SUBSPLIT_TOKEN
#   ③ packagist：显式 POST 更新三个包的 webhook——开关 `vars.PACKAGIST_ENABLED=true`（若已在 Packagist
#      后台为拆分仓配好 GitHub webhook，此 job 不配也无妨，双保险）
#   ④ npm：@nythros/client 发布——开关 `vars.NPM_PUBLISH_ENABLED=true`（npm org 暂不动时即走跳过分支）
# 启用开关走 repository variable（vars 是 job 级 if 的合法上下文；secrets 不是，见 subsplit 注释）。
# 人工前置清单见 blueprint/adr/ADR-019 §5 与 docs/deployment.md 发布节。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # service 容器与 CI 对齐：release 门禁跑 phpunit 全量，含 Redis/MySQL 集成测试。
    # 历史缺失该声明时，无服务环境的集成用例与依赖在线态的守卫用例会硬失败——
    # 「声称跑质量门禁却不给门禁要的环境」是历史缺陷（CI 绿、Release 红同提交可证）。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: nythros
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: redis, pdo_mysql # 与 CI 对齐：pdo_mysql 供 MySqlStorage 集成测试真跑
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify (PHPUnit + PHPStan)
        run: |
          vendor/bin/phpunit
          vendor/bin/phpstan analyse --no-progress

      - name: Pack composer archives (nythros/engine, nythros/framework)
        run: |
          mkdir -p dist
          composer archive nythros/engine --format=zip --dir=dist
          composer archive nythros/framework --format=zip --dir=dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      # 验证 tag（*-verify，见 deployment §9.1）跳过 Release 发布：验证跑只验门禁 + subsplit 推送链路，
      # 不把测试版本推上 Releases 页（尤其不抢 Latest 标记）。
      - name: Create GitHub Release
        if: ${{ !contains(github.ref_name, '-verify') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # subsplit：tag 驱动的发布镜像。SUBSPLIT_TOKEN = 对 Nythros/engine、Nythros/framework、Nythros/skeleton
  # 有 Contents:write 的 PAT（fine-grained 即可）。拆分仓必须建为空仓（不勾 README/gitignore），
  # 首推由本 job 完成；后续每次 tag 重算拆分并强制同步 main + 同名版本 tag。
  # 注意：Nythros/skeleton 已有手工推送的历史（建仓验证），首次 subsplit tag 会 --force 覆盖之（预期内，
  # 拆分树自此以 monorepo packages/skeleton 为唯一事实源）。
  #  注意（历史缺陷修复，两处）：
  #  ① secrets 上下文在 job 级 if 中不被 GitHub 允许（可用仅 github/needs/vars/inputs），历史
  #     `if: ${{ secrets.X != '' }}` 让整个 workflow 加载期校验失败（tag 运行 jobs=0、从不产出 Release）；
  #  ② 用 job 级 env 桥接 secret 也不可靠：未定义的 secret 注入 env 时该变量不存在（非空串），
  #     `env.X != ''` 恒真 → 未配 token 的 job 照跑并 push 无凭证失败。
  #  最终方案：启用开关走 repository variable（vars 是 job 级 if 的合法上下文），secret 仅在
  #  已确认启用的 step 内引用。渐进启用：未设 `vars.SUBSPLIT_ENABLED=true` 时整个 job 跳过。
  subsplit:
    name: Subsplit packages to Nythros/{engine,framework,skeleton}
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.SUBSPLIT_ENABLED == 'true' }}
    strategy:
      matrix:
        package: [engine, framework, skeleton]
    steps:
      - name: Checkout (full history for subtree split)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 关键：不持久化内置 GITHUB_TOKEN。checkout 默认 persist-credentials: true，会往本地 git config
          # 写 http.https://github.com/.extraheader（Authorization: basic <GITHUB_TOKEN>），该头优先级
          # **高于** push URL 里内嵌的 PAT —— 于是下面的 push 以 github-actions[bot] 身份发出，对镜像仓
          # 必然 403（v0.2.1-verify 实测：Permission to Nythros/framework.git denied to github-actions[bot]）。
          persist-credentials: false

      - name: Split subdirectory
        run: |
          git config user.name "nythros-release-bot"
          git config user.email "release-bot@nythros.local"
          git subtree split -P "packages/${{ matrix.package }}" -b "subsplit-${GITHUB_REF_NAME}"

      # skeleton 拆分专属：把依赖约束对齐到本次 tag 的次版本（如 v0.2.1 → ^0.2）。
      # 拆分树里没有 monorepo path 仓库，composer.json 本就能独立解析，这里只做版本纪律，
      # 保证「skeleton tag 与兼容的 engine/framework 次版本对齐」（Nythros/skeleton README 约定）。
      # 用 `composer require --no-update` 而非 `composer config require.x`：后者在 Composer 2.10
      # 直接报 "Setting require.x does not exist or is not supported by this command"（exit 1，
      # v0.2.0 首发 run 的 skeleton job 即死于此步）；--no-update 只改 composer.json、不解析依赖
      # 不联网，约束值未变时字节等价（实测 diff 为空）。runner 镜像自带 PHP 8.3 + Composer 2.10。
      - name: Sync skeleton dependency constraints to tag
        if: matrix.package == 'skeleton'
        run: |
          git checkout "subsplit-${GITHUB_REF_NAME}"
          MM="${GITHUB_REF_NAME#v}"; MM="${MM%.*}"
          composer require --no-update --no-interaction \
            "nythros/engine:^${MM}" "nythros/framework:^${MM}"
          git add composer.json
          git diff --cached --quiet || git commit -m "release: 依赖约束对齐 ${GITHUB_REF_NAME}"

      - name: Push mirror (main + version tag)
        run: |
          test -n "${{ secrets.SUBSPLIT_TOKEN }}" || { echo "::error::SUBSPLIT_ENABLED=true 但 SUBSPLIT_TOKEN secret 未配置"; exit 1; }
          # 防御性清理：即便 checkout 行为变化，也确保推送用 URL 内嵌 PAT 而非内置 GITHUB_TOKEN
          # （extraheader 里的 Authorization 头会覆盖 URL 凭据，是「403 denied to github-actions[bot]」的根因）
          git config --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          git push --force \
            "https://x-access-token:${{ secrets.SUBSPLIT_TOKEN }}@github.com/Nythros/${{ matrix.package }}.git" \
            "refs/heads/subsplit-${GITHUB_REF_NAME}:refs/heads/main"
          git tag -f "${GITHUB_REF_NAME}" "subsplit-${GITHUB_REF_NAME}"
          git push --force \
            "https://x-access-token:${{ secrets.SUBSPLIT_TOKEN }}@github.com/Nythros/${{ matrix.package }}.git" \
            "refs/tags/${GITHUB_REF_NAME}"

  # packagist 显式触发（可选双保险）：PACKAGIST_TOKEN = packagist.com/profile 的 API token，
  # PACKAGIST_USERNAME = packagist 用户名。拆分仓若已在 packagist 注册并配 GitHub webhook，
  # 此 job 可跳过不配；两者都就绪时 webhook 与显式 POST 幂等共存。
  # 启用开关同 subsplit（vars.PACKAGIST_ENABLED）；needs 的 subsplit 被跳过时本 job 亦跳过。
  # 验证 tag（*-verify）不触发发布侧副作用：只验门禁 + subsplit 推送链路。
  packagist:
    name: Notify Packagist
    runs-on: ubuntu-latest
    needs: subsplit
    if: ${{ vars.PACKAGIST_ENABLED == 'true' && !contains(github.ref_name, '-verify') }}
    steps:
      - name: Update packages
        run: |
          test -n "${{ secrets.PACKAGIST_TOKEN }}" || { echo "::error::PACKAGIST_ENABLED=true 但 PACKAGIST_TOKEN secret 未配置"; exit 1; }
          for pkg in engine framework skeleton; do
            curl -sf -X POST "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
              -d "repository[url]=https://github.com/Nythros/${pkg}" \
              && echo "packagist updated: nythros/${pkg}"
          done

  # npm 自动发布：@nythros/client 随 v* tag 发布（需 repo secret NPM_TOKEN；test/ 不在 files
  # 清单，包体干净）。启用开关 vars.NPM_PUBLISH_ENABLED。
  # 启用前置：npmjs.com 注册 @nythros org（或改 package.json 的 name 到自有 scope）+ Automation token
  # 入 NPM_TOKEN。version 已是 0.1.0（非 dev-main），但 workflow 不会随 tag 自动改版本——每次发版前
  # 手动把 packages/client-js/package.json 的 version 升到对应版本（npm 拒绝重复版本号）。
  # 分步配置清单见 docs/deployment.md §9.1。
  # 验证 tag（*-verify）不发布 npm：测试版本发布不可回收（同版本号不可重发）。
  npm:
    name: Publish @nythros/client
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && !contains(github.ref_name, '-verify') }}
    defaults:
      run:
        working-directory: packages/client-js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Tests (node:test)
        run: npm test

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
